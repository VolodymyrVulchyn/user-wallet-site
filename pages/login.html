<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід | User Wallet</title>
  <link rel="stylesheet" href="/user-wallet-site/css/main.css">
</head>
<body class="login">

  <div class="login__container">
    
    <!-- Соціальний вхід -->
    <div class="login__socials">
      <div class="login__social" title="Увійти через Google">
        <img src="/user-wallet-site/assets/images/login/google-icon.png" alt="Google" >
        <span>Google</span>
      </div>
      <div class="login__social" title="Увійти через LinkedIn">
        <img src="/user-wallet-site/assets/images/login/linkedin-icon.png" alt="LinkedIn">
        <span>LinkedIn</span>
      </div>
    </div>

    <h1 class="login__title">Вхід до гаманця</h1>

    <form action="wallet.html" method="post" class="login__form">
      <label for="email">Електронна пошта</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="login__btn">Увійти</button>
    </form>

    <p class="login__register">Ще не маєте акаунту? <a href="user-create.html">Зареєструватися</a></p>
  </div>

</body>
</html>
